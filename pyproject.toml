[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nidslab"
version = "0.1.0"
description = "Classical machine-learning benchmark for network intrusion detection on public datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Md Motasaddik Azmine" }]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nidslab = "nidslab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
